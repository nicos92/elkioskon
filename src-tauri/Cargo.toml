[package]
name = "el-kioskon-app"
version = "0.5.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "el_kioskon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
thiserror = "1.0"
directories = "5.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
chrono-tz = { version = "0.10.4", default-features = false }
mockall = "0.13"
tempfile = "3"

# `all` queda en el priority default (0) y los lints puntuales en 1 a propósito:
# en Cargo el priority MÁS ALTO gana, así que al revés el `deny` de `all` taparía
# el `warn` de `unnecessary_wraps`. No se activa `pedantic` completo: ver
# docs/revision-buenas-practicas-rust.md §5, son 263 `missing_errors_doc` y las
# firmas de comandos Tauri *deben* ser `String`/`Vec` por ownership de serde.
[lints.rust]
unsafe_code = "forbid"
# Cargo exige que un grupo tenga prioridad distinta de los lints puntuales de la
# misma tabla; -1 lo deja por debajo de `unsafe_code` sin perder efecto propio.
future_incompatible = { level = "warn", priority = -1 }

[lints.clippy]
all = "deny"
redundant_clone = { level = "deny", priority = 1 }
needless_borrow = { level = "deny", priority = 1 }
large_enum_variant = { level = "deny", priority = 1 }
clone_on_copy = { level = "deny", priority = 1 }
manual_ok_or = { level = "deny", priority = 1 }
map_unwrap_or = { level = "deny", priority = 1 }
needless_collect = { level = "deny", priority = 1 }
unnecessary_wraps = { level = "warn", priority = 1 }
